# Opción A — CPU (VPS con Dokploy o cualquier PC):   docker compose up -d --build
# Opción B — GPU NVIDIA (MuseTalk):                   docker compose --profile gpu up -d --build clon-gpu
services:
  clon-cpu:
    build: .
    container_name: clon-docente
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      APP_TOKEN: ${APP_TOKEN:-}          # clave de acceso (obligatoria si se expone a Internet)
      W2L_BATCH: ${W2L_BATCH:-32}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
    volumes:
      - clon_data:/data

  clon-gpu:
    profiles: ["gpu"]
    build: { context: ., dockerfile: Dockerfile.gpu }
    container_name: clon-docente-gpu
    restart: unless-stopped
    ports: ["8001:8000"]
    environment:
      APP_TOKEN: ${APP_TOKEN:-}
      BATCH_SIZE: ${BATCH_SIZE:-20}
    volumes:
      - clon_data_gpu:/data
      - musetalk_models:/opt/MuseTalk/models
      - musetalk_results:/opt/MuseTalk/results
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  clon_data:
  clon_data_gpu:
  musetalk_models:
  musetalk_results:
